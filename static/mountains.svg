<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
  <!-- The page background: faint ink-wash mountains in the shan shui style. Each range is
       pale ink that fades from its ridge down into mist, so the ridges read clearly and the
       bases dissolve into haze. (No blur filters: they band into stripes on dark pages.) -->
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcf" stop-opacity=".06"/>
      <stop offset=".45" stop-color="#e9dfcf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcf" stop-opacity=".085"/>
      <stop offset=".6" stop-color="#e9dfcf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfcf" stop-opacity=".11"/>
      <stop offset="1" stop-color="#e9dfcf" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <!-- far range -->
  <path fill="url(#far)"
        d="M0 250 C80 210 130 150 200 170 C250 185 280 118 340 128 C400 138 430 190 500 175
           C560 160 600 98 670 113 C740 128 770 185 840 170 C900 155 940 118 1000 133
           C1060 148 1110 190 1200 175 V400 H0Z"/>
  <!-- middle range -->
  <path fill="url(#mid)"
        d="M0 300 C70 280 120 238 190 253 C260 268 300 222 370 232 C440 242 470 284 540 274
           C610 264 650 218 720 228 C790 238 830 280 900 270 C970 260 1010 228 1080 238
           C1140 246 1170 270 1200 265 V400 H0Z"/>
  <!-- near range -->
  <path fill="url(#near)"
        d="M0 345 C90 330 150 310 230 322 C310 334 360 312 440 318 C520 324 580 345 660 338
           C740 331 800 310 880 318 C960 326 1020 342 1100 335 C1150 331 1180 334 1200 332 V400 H0Z"/>
</svg>
