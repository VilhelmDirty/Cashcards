<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wheelwright: a wheel in ink wash with a small vermilion seal (same as the header logo).
       Thicker strokes than the header version so it still reads at 16-32 pixels. -->
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <g filter="url(#ink)" fill="none" stroke="#e9dfcf" stroke-linecap="round">
    <circle cx="48" cy="50" r="34" stroke-width="10" stroke-dasharray="170 44" transform="rotate(-100 48 50)"/>
    <path d="M48 22V78M23 36l50 28M23 64l50-28" stroke-width="6"/>
    <circle cx="48" cy="50" r="6" stroke-width="7"/>
  </g>
  <rect x="72" y="72" width="22" height="22" rx="3" fill="#b8392b"/>
</svg>
