<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Finance Flashcards{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="{{ url_for('home') }}" class="brand">Finance Flashcards</a>
      <span class="nav-links">
        <a href="{{ url_for('new_card') }}" class="nav-link">Add card</a>
        <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
      </span>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
